<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validación facial con voz</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f7f9ff;background:#080b13}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -15%,#203456 0,transparent 60%),#080b13;display:flex;align-items:center;justify-content:center}.app{position:relative;width:min(100%,470px);padding:36px 25px 28px;text-align:center;animation:enter .75s ease both}.pill{display:inline-block;letter-spacing:2px;font-size:10px;font-weight:750;color:#91b9ff;margin-bottom:15px}h1{font-size:31px;letter-spacing:-1.4px;font-weight:750;margin:0 0 9px}p{font-size:14px;color:#a0acc0;line-height:1.6;margin:0}.camera{position:relative;aspect-ratio:1/1.19;margin:27px 0 22px;border-radius:32px;overflow:hidden;background:linear-gradient(150deg,#1a273d,#0e1726);border:1px solid #ffffff23;box-shadow:0 28px 75px #0008,0 0 0 7px #ffffff06;isolation:isolate}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}.oval{position:absolute;inset:12% 17%;border:2px solid #ffffffb5;border-radius:48%;pointer-events:none;box-shadow:0 0 0 999px #06101d4d,0 0 26px #72b6ff88,inset 0 0 28px #72b6ff30;transition:border-color .35s,box-shadow .35s;animation:breath 3.2s ease-in-out infinite}.camera.good .oval{border-color:#71f5d4;box-shadow:0 0 0 999px #06101d36,0 0 35px #50f0c788}.camera.done .oval{border-color:#71f5d4;animation:none}.glow{position:absolute;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,#83d8ff,transparent);box-shadow:0 0 20px #75ceff;top:19%;animation:scan 3.8s ease-in-out infinite;pointer-events:none}.status{font-size:18px;font-weight:700;letter-spacing:-.3px;min-height:26px;transition:opacity .2s}.detail{min-height:36px;margin:9px auto 16px;max-width:330px;font-size:13px;color:#9daec1;overflow-wrap:anywhere}.progress{height:4px;border-radius:99px;background:#ffffff20;overflow:hidden;margin:0 8px 19px}.bar{width:0;height:100%;background:linear-gradient(90deg,#6f91ff,#68f0d4);transition:width .5s ease}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}button{border:1px solid #ffffff26;border-radius:13px;padding:12px 16px;background:#ffffff12;color:#f9fbff;font-size:13px;font-weight:650;cursor:pointer;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}button:disabled{opacity:.4}#start{background:#e7f1ff;color:#122039;border:0;padding:15px 27px}#enroll,#verify{display:none}.small{font-size:11px;margin:20px auto 0;max-width:350px;color:#71819b}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(130deg,#ffffff10,transparent 35%,transparent 75%,#ffffff05);z-index:2}@keyframes breath{50%{box-shadow:0 0 0 999px #06101d4d,0 0 40px #72b6ffbb,inset 0 0 40px #72b6ff55}}@keyframes scan{0%,100%{top:18%;opacity:.25}50%{top:81%;opacity:.85}}@keyframes enter{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><style>
[hidden]{display:none!important}.app{animation:enter 1s cubic-bezier(.2,.8,.2,1) both}.camera{transition:box-shadow .55s,border-color .55s;box-shadow:0 28px 75px #0008,0 0 0 7px #ffffff06}.camera.tracked{border-color:#8cecff80;box-shadow:0 28px 75px #0008,0 0 35px #2bbaff33}.oval{border:1.5px solid #9bcaff9e;box-shadow:0 0 0 999px #06101d36,0 0 30px #72b6ff33;animation:breath 3.2s ease-in-out infinite,ovalFloat 5s ease-in-out infinite}.camera.tracked .oval{border-color:#a5f9ff;box-shadow:0 0 0 999px #06101d1a,0 0 35px #75eaff77}.facehint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:3;padding:9px 15px;border:1px solid #ffffff35;border-radius:30px;background:#07142588;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:11px;font-weight:650;letter-spacing:.4px;white-space:nowrap;color:#d5e6ff;transition:color .4s}.camera.tracked .facehint{color:#8efbe4}.glow{opacity:.6}.actions #mute,.actions #clear{font-size:12px;opacity:.65}#start:not([hidden]){display:inline-block}.status{animation:fadeIn .6s ease}.glass{z-index:0}@keyframes ovalFloat{50%{transform:scale(1.025)}}@keyframes fadeIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}@media(prefers-reduced-motion:reduce){.oval,.status{animation:none!important}}
</style><style>.status,.detail,.small,.pill{display:none!important}.actions:empty{display:none}#nameForm{margin:20px 0 0;display:grid;gap:12px;text-align:left;padding:20px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff0c;backdrop-filter:blur(16px)}#nameForm[hidden],#welcome[hidden]{display:none!important}#nameForm label{font-size:15px;font-weight:650}#personName{width:100%;background:#ffffff14;border:1px solid #ffffff35;color:white;border-radius:12px;padding:14px;font:inherit;outline:none}#personName:focus{border-color:#7fe6ff}#nameForm button{background:#e7f1ff;color:#122039}#welcome{animation:enter .7s ease both;margin-top:22px}#welcome h2{font-size:25px;letter-spacing:-.8px}#start:not([hidden]){display:inline-block}</style></head><body><main class="app"><h1>Verificá tu identidad</h1><p>Para continuar, debés completar una verificación facial.</p><div class="camera" id="camera"><div class="glass"></div><div class="glow"></div><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div class="oval"></div><div class="facehint" id="facehint">Buscando rostro</div></div><div class="status" id="status" aria-live="polite" hidden></div><p class="detail" id="detail" hidden></p><div class="progress"><div class="bar" id="bar"></div></div><div class="actions"><button id="start" hidden>Iniciar cámara</button><button id="enroll" class="secondary" disabled>Registrar rostro</button><button id="verify" class="secondary" disabled>Verificar identidad</button></div><form id="nameForm" hidden><label for="personName">¿Cómo te llamás?</label><input id="personName" maxlength="50" autocomplete="given-name" placeholder="Tu nombre" required><button type="submit">Guardar credencial</button></form><div id="welcome" hidden><h2 id="welcomeTitle"></h2><p>Verificación completada.</p></div></main><script>

const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d');let landmarker,stream,muted=false,working=false,lastResult=null;let cameraStarting=false;const KEY='face-voice-credential-v2',OLD_KEY='face-voice-demo-template-v1';
function say(t){if(muted||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.9;speechSynthesis.speak(u)}catch(e){console.warn('Voz no disponible',e)}}function status(t,detail=''){$('status').textContent=t;if(detail)$('detail').textContent=detail;$('facehint').textContent=t;say(t)}
function getCredential(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&Array.isArray(x.template)&&typeof x.name==='string'?x:null}catch{return null}}
function saveCredential(name,template){const credential={version:1,name,template,createdAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(credential));localStorage.removeItem(OLD_KEY);const blob=new Blob([JSON.stringify(credential,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='credencial-facial.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return credential}
function welcome(name){$('nameForm').hidden=true;$('welcome').hidden=false;$('welcomeTitle').textContent='¡Bienvenid@, '+name+'!';$('facehint').textContent='Identidad verificada';$('camera').classList.add('done');$('bar').style.width='100%';say('Bienvenido, '+name)}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();const name=$('personName').value.trim().replace(/\s+/g,' ').slice(0,50);if(!name)return;try{saveCredential(name,pendingTemplate);pendingTemplate=null;welcome(name)}catch(err){$('facehint').textContent='No se pudo guardar. Reintentá.'}});
let pendingTemplate=null;
async function loadVision(){if(window.vision?.FaceLandmarker)return;const urls=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs','https://unpkg.com/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs'];let errors=[];for(const url of urls){try{const mod=await import(url);if(mod.FaceLandmarker&&mod.FilesetResolver){window.vision=mod;window.visionWasmBase=url.includes('jsdelivr')?'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/wasm':'https://unpkg.com/@mediapipe/tasks-vision@1.2.2/wasm';return}throw Error('Módulo sin FaceLandmarker')}catch(e){errors.push(e.message)}}throw Error('No se pudo importar el módulo oficial de MediaPipe: '+errors.join('; '))}
async function startCamera(){if(cameraStarting||landmarker)return;cameraStarting=true;const btn=$('start');btn.disabled=true;try{status('Solicitando acceso a la cámara…');if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abrí la web directamente en Safari mediante HTTPS, no dentro de otra aplicación.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();status('Cámara activada. Cargando reconocimiento facial…');btn.textContent='Cámara activada';btn.hidden=true;try{await loadVision();const {FaceLandmarker,FilesetResolver}=window.vision;const vision=await FilesetResolver.forVisionTasks(window.visionWasmBase);landmarker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});$('enroll').disabled=false;$('verify').disabled=false;status('Ubicá tu rostro dentro del óvalo.');requestAnimationFrame(tick);setTimeout(()=>{if(!working)flow(getCredential()?'verify':'enroll')},1200)}catch(err){status('Cámara activa, pero no se pudo cargar el reconocimiento.','Error de biblioteca: '+err.message+'; verificá tu conexión e intentá recargar.')}}catch(err){btn.disabled=false;btn.hidden=false;btn.textContent='Intentar de nuevo';const msg=err.name==='NotAllowedError'?'Permiso de cámara denegado. Habilitalo en Safari.':err.name==='NotFoundError'?'No se encontró una cámara.':err.message;status('No se pudo activar la cámara.',msg)}finally{cameraStarting=false}};
$('start').onclick=startCamera;
window.addEventListener('load',()=>setTimeout(startCamera,1000));
let prevTime=-1;
const meshEdges=[[10,338],[338,297],[297,332],[332,284],[284,251],[251,389],[389,356],[356,454],[454,323],[323,361],[361,288],[288,397],[397,365],[365,379],[379,378],[378,400],[400,377],[377,152],[152,148],[148,176],[176,149],[149,150],[150,136],[136,172],[172,58],[58,132],[132,93],[93,234],[234,127],[127,162],[162,21],[21,54],[54,103],[103,67],[67,109],[109,10],[33,133],[133,168],[168,362],[362,263],[33,1],[1,263],[61,291],[61,4],[4,291],[1,4],[4,152],[234,61],[291,454],[33,61],[263,291],[168,1],[61,152],[291,152],[70,105],[105,107],[107,10],[300,334],[334,336],[336,10],[70,33],[300,263],[98,4],[327,4],[98,61],[327,291]];
function tick(){if(video.readyState>=2&&landmarker){try{if(video.currentTime!==prevTime){prevTime=video.currentTime;lastResult=landmarker.detectForVideo(video,performance.now())}overlay.width=video.videoWidth;overlay.height=video.videoHeight;ctx.clearRect(0,0,overlay.width,overlay.height);const face=lastResult?.faceLandmarks?.[0];$('camera').classList.toggle('tracked',!!face);if(!working&&!$('welcome').hidden){/* keep success message */}else if(!working){$('facehint').textContent=face?'Rostro detectado':'Buscando rostro';}if(face){const w=overlay.width,h=overlay.height;ctx.lineWidth=Math.max(1,w/460);ctx.strokeStyle='rgba(136,239,255,.67)';ctx.shadowColor='#6feaff';ctx.shadowBlur=9;ctx.beginPath();for(const [a,b] of meshEdges){ctx.moveTo(face[a].x*w,face[a].y*h);ctx.lineTo(face[b].x*w,face[b].y*h)}ctx.stroke();ctx.shadowBlur=13;ctx.fillStyle='#b5faff';const nodes=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,33,133,168,362,263,61,291,1,4,70,300,98,327];for(const i of nodes){const p=face[i];ctx.beginPath();ctx.arc(p.x*w,p.y*h,Math.max(2.5,w/170),0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}}catch(e){console.error(e)}}if(stream)requestAnimationFrame(tick)}
function vector(face){const ids=[33,133,263,362,1,4,61,291,13,14,152,10,234,454,70,300,105,334,168,6,197,195,5,98,327];const l=face[33],r=face[263];const scale=Math.hypot(r.x-l.x,r.y-l.y)||1;const cx=(l.x+r.x)/2,cy=(l.y+r.y)/2;return ids.flatMap(i=>[(face[i].x-cx)/scale,(face[i].y-cy)/scale])}function distance(a,b){return Math.sqrt(a.reduce((s,x,i)=>s+(x-b[i])**2,0)/a.length)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function sample(){const all=[];for(let i=0;i<15;i++){await wait(130);const f=lastResult?.faceLandmarks?.[0];if(f)all.push(vector(f))}if(all.length<10)throw Error('No se detectó un rostro estable.');return all[0].map((_,j)=>all.reduce((s,a)=>s+a[j],0)/all.length)}
function blend(name){return lastResult?.faceBlendshapes?.[0]?.categories?.find(x=>x.categoryName===name)?.score||0}function setStep(n,t,d){$('bar').style.width=(n*25)+'%';status(t,d);$('camera').classList.toggle('good',n>0)}
function facePose(f){const left=f[234],right=f[454],nose=f[1];const width=Math.abs(right.x-left.x)||1;return (nose.x-(left.x+right.x)/2)/width}
async function awaitFace(timeout=18000){let stable=0;const until=Date.now()+timeout;while(Date.now()<until){await wait(170);const f=lastResult?.faceLandmarks?.[0];if(f){const center=f[1];const size=Math.abs(f[454].x-f[234].x);if(center.x>.25&&center.x<.75&&center.y>.2&&center.y<.8&&size>.16){stable++;if(stable>=5)return true}else stable=0}else stable=0}return false}
async function awaitTurn(direction,timeout=20000){const until=Date.now()+timeout;let streak=0;let maximum=0;while(Date.now()<until){await wait(130);const f=lastResult?.faceLandmarks?.[0];if(!f){streak=0;continue}const yaw=facePose(f);const signed=yaw*direction;maximum=Math.max(maximum,signed);if(signed>.065){if(++streak>=3)return true}else streak=0}throw Error('No se detectó el giro. Mové la cabeza lentamente, sin mover el teléfono.')}
async function awaitBlink(timeout=16000){const until=Date.now()+timeout;let seenOpen=false;let closed=false;while(Date.now()<until){await wait(110);if(!lastResult?.faceLandmarks?.length)continue;const a=blend('eyeBlinkLeft'),b=blend('eyeBlinkRight');if(a<.27&&b<.27)seenOpen=true;if(seenOpen&&a>.42&&b>.42)closed=true;if(closed&&a<.32&&b<.32)return true}throw Error('No se detectó el parpadeo.')}
async function flow(mode){if(working||!landmarker)return;working=true;$('enroll').disabled=$('verify').disabled=true;try{setStep(0,'Centrando tu rostro…','Mirá de frente y mantené el teléfono quieto.');if(!await awaitFace())throw Error('No se encontró el rostro centrado.');setStep(1,'Girá la cabeza a tu derecha','Giralo lentamente, como si miraras hacia tu hombro derecho.');await awaitTurn(-1);setStep(2,'Ahora hacia tu izquierda','Girá la cabeza hacia el otro lado.');await awaitTurn(1);setStep(3,'Parpadeá una vez','Volvé a mirar de frente y cerrá ambos ojos un instante.');await awaitBlink();setStep(3,'Analizando tu rostro…','Mantené la mirada al frente.');await wait(800);const v=await sample();if(mode==='enroll'){pendingTemplate=v;$('nameForm').hidden=false;$('personName').focus();setStep(4,'Registro completado','Escribí tu nombre para guardar la credencial.')}else{const saved=getCredential();if(!saved)throw Error('No hay un rostro registrado.');const d=distance(v,saved.template);if(d<.115){setStep(4,'Identidad verificada','Acceso concedido.');welcome(saved.name)}else throw Error('El rostro no coincide con el registro guardado.')} $('camera').classList.add('done')}catch(e){$('camera').classList.remove('good');status('No se completó la validación',e.message);$('bar').style.width='0';$('start').hidden=false;$('start').textContent='Reintentar';$('start').disabled=false;$('start').onclick=()=>{ $('start').hidden=true;flow(localStorage.getItem(KEY)?'verify':'enroll')}}finally{working=false;$('enroll').disabled=$('verify').disabled=false}}
$('enroll').onclick=()=>flow('enroll');$('verify').onclick=()=>flow('verify');window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
