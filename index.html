<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identity · Acceso facial</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#080b10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#080b10;display:grid;place-items:center}.app{width:min(100%,450px);min-height:100svh;padding:45px 24px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .7s ease both}.brand{font-size:10px;letter-spacing:3px;font-weight:700;color:#9ba9ba;margin-bottom:36px}.brand:before{content:'◇';font-size:17px;margin-right:10px;color:#a5d4ff}h1{font-size:32px;letter-spacing:-1.5px;font-weight:680;margin:0 0 11px}.intro p{font-size:13px;line-height:1.65;color:#8d99a9;max-width:280px;margin:auto}.camera{position:relative;width:100%;aspect-ratio:1/1.13;margin:28px 0 23px;border-radius:28px;overflow:hidden;background:#151d29;border:1px solid #ffffff16;box-shadow:0 25px 65px #0008;isolation:isolate}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;filter:saturate(.85)}canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}.oval{position:absolute;inset:12% 18%;border:1px solid #d7eaffb0;border-radius:48%;pointer-events:none;box-shadow:0 0 0 999px #05080e56,0 0 30px #80caff33;animation:halo 4s ease-in-out infinite}.oval:before,.oval:after{content:'';position:absolute;inset:-8px;border:1px dashed #a8dfff60;border-radius:inherit;animation:orbit 19s linear infinite}.oval:after{inset:-17px;border-color:#a8dfff28;animation-duration:29s;animation-direction:reverse}.camera.good .oval,.camera.done .oval{border-color:#a4f9dd;box-shadow:0 0 0 999px #05080e45,0 0 40px #71edcc66}.scan{position:absolute;left:20%;right:20%;top:17%;height:1px;background:linear-gradient(90deg,transparent,#d5faff,transparent);box-shadow:0 0 20px 2px #80d7ff88;animation:scan 4.3s ease-in-out infinite;pointer-events:none}.scan:after{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(0deg,#8ed8ff12,transparent)}.orb{position:absolute;width:5px;height:5px;border-radius:50%;background:#b9f4ff;box-shadow:0 0 12px 3px #7ed9ff;pointer-events:none;animation:float 4s ease-in-out infinite}.orb.a{left:17%;top:44%}.orb.b{right:17%;top:29%;animation-delay:-2s}.corner{position:absolute;width:24px;height:24px;border-color:#b4e4ff5c;pointer-events:none}.corner.tl{top:18px;left:18px;border-top:1px solid;border-left:1px solid;border-radius:8px 0 0 0}.corner.tr{top:18px;right:18px;border-top:1px solid;border-right:1px solid;border-radius:0 8px 0 0}.corner.bl{bottom:18px;left:18px;border-bottom:1px solid;border-left:1px solid;border-radius:0 0 0 8px}.corner.br{bottom:18px;right:18px;border-bottom:1px solid;border-right:1px solid;border-radius:0 0 8px 0}.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;padding:11px 15px;border:1px solid #ffffff25;background:#0d1523d9;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:12px;color:#eff7ff;font-size:12px;line-height:1.45;font-weight:600;z-index:4}.hint:before{content:'';display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;background:#9cddff;box-shadow:0 0 9px #9cddff;animation:blink 1.8s ease-in-out infinite}.progress{width:100%;height:2px;background:#ffffff19;border-radius:99px;overflow:hidden;margin-bottom:21px}.bar{width:0;height:100%;background:linear-gradient(90deg,#80b6ff,#87f0d9);transition:width .55s ease}.actions{width:100%}button{width:100%;border:0;border-radius:13px;padding:15px;background:#eaf1fa;color:#142234;font:inherit;font-size:14px;font-weight:650;cursor:pointer}button:disabled{opacity:.4}#enroll,#verify,#mute,#clear,.pill,.status,.detail,.small{display:none!important}[hidden]{display:none!important}.nameForm{width:100%;display:grid;gap:12px;text-align:left;animation:enter .6s ease}.nameForm label{font-size:16px;font-weight:650}.nameForm input{width:100%;background:#ffffff10;border:1px solid #ffffff30;color:white;border-radius:13px;padding:16px;font:inherit;outline:none}.nameForm input:focus{border-color:#a2d9ff}.welcome{width:100%;animation:enter .7s ease}.welcome .check{font-size:32px;color:#9af5d9;margin-bottom:12px}.welcome h2{font-size:26px;letter-spacing:-1px;margin:0 0 9px}.welcome p{color:#92a0b0;font-size:13px}.subtle{margin-top:auto;padding-top:24px;color:#647186;font-size:11px}@keyframes enter{from{opacity:0;transform:translateY(13px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@keyframes halo{50%{box-shadow:0 0 0 999px #05080e56,0 0 45px #80caff66}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{top:17%;opacity:.2}50%{top:81%;opacity:.95}}@keyframes float{50%{transform:translateY(16px);opacity:.35}}@keyframes blink{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class="app"><div class="brand">IDENTITY</div><header class="intro"><h1>Acceso facial</h1><p>Ubicá tu rostro dentro del marco para continuar.</p></header><section class="camera" id="camera" aria-label="Cámara para verificación facial"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div class="oval"></div><div class="scan"></div><i class="orb a"></i><i class="orb b"></i><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="hint" id="hint" aria-live="polite">Preparando verificación…</div></section><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status" aria-live="polite"></div><p class="detail" id="detail"></p><div class="actions"><button id="start" hidden>Continuar con cámara</button><button id="enroll" disabled>Registrar rostro</button><button id="verify" disabled>Verificar identidad</button><button id="mute">Voz</button><button id="clear">Borrar</button></div><form class="nameForm" id="nameForm" hidden><label for="personName">¿Cómo te llamás?</label><input id="personName" type="text" maxlength="48" autocomplete="given-name" placeholder="Escribí tu nombre" required><button type="submit">Crear mi credencial</button></form><section class="welcome" id="welcome" hidden><div class="check">✓</div><h2 id="welcomeTitle"></h2><p>Acceso completado en este dispositivo.</p></section><div class="subtle">Tus datos permanecen en este navegador.</div></main><script>

const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d');let landmarker,stream,muted=false,working=false,lastResult=null;const KEY='identity-credential-v1',OLD='face-voice-demo-template-v1';let pendingTemplate=null;let starting=false;
let voiceReady=false;function selectVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>v.lang==='es-AR'&&/premium|enhanced|natural/i.test(v.name))||voices.find(v=>v.lang.startsWith('es')&&/premium|enhanced|natural/i.test(v.name))||voices.find(v=>v.lang==='es-AR')||voices.find(v=>v.lang.startsWith('es'))}function say(t){}function status(t,detail=''){$('status').textContent=t;if(detail)$('detail').textContent=detail;$('hint').textContent=t;say(t)}
function credential(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x.name==='string'&&Array.isArray(x.template)?x:null}catch{return null}}
function welcome(name){$('welcome').hidden=false;$('nameForm').hidden=true;$('start').hidden=true;$('welcomeTitle').textContent='¡Bienvenid@, '+name+'!';$('hint').textContent='Identidad verificada';$('bar').style.width='100%';$('camera').classList.add('done');say('Bienvenido, '+name)}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();const name=$('personName').value.trim().replace(/\s+/g,' ').slice(0,48);if(!name||!pendingTemplate)return;const record={version:1,name,template:pendingTemplate,createdAt:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(record));localStorage.removeItem(OLD);pendingTemplate=null;welcome(name)}catch(err){$('hint').textContent='No se pudo guardar el registro en este navegador.'}});

async function loadVision(){if(window.vision?.FaceLandmarker)return;const urls=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs','https://unpkg.com/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs'];let errors=[];for(const url of urls){try{const mod=await import(url);if(mod.FaceLandmarker&&mod.FilesetResolver){window.vision=mod;window.visionWasmBase=url.includes('jsdelivr')?'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/wasm':'https://unpkg.com/@mediapipe/tasks-vision@1.2.2/wasm';return}throw Error('Módulo sin FaceLandmarker')}catch(e){errors.push(e.message)}}throw Error('No se pudo importar el módulo oficial de MediaPipe: '+errors.join('; '))}
async function startCamera(){if(starting||landmarker)return;starting=true;const btn=$('start');btn.disabled=true;try{status('Solicitando acceso a la cámara…');if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abrí la web directamente en Safari mediante HTTPS, no dentro de otra aplicación.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();status('Cámara activada. Cargando reconocimiento facial…');btn.hidden=true;try{await loadVision();const {FaceLandmarker,FilesetResolver}=window.vision;const vision=await FilesetResolver.forVisionTasks(window.visionWasmBase);landmarker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});$('enroll').disabled=false;$('verify').disabled=false;status('Ubicá tu rostro dentro del óvalo.');requestAnimationFrame(tick);setTimeout(()=>{if(!working)flow(credential()?'verify':'enroll')},1200)}catch(err){status('Cámara activa, pero no se pudo cargar el reconocimiento.','Error de biblioteca: '+err.message+'; verificá tu conexión e intentá recargar.')}}catch(err){btn.disabled=false;btn.hidden=false;btn.textContent='Continuar con cámara';const msg=err.name==='NotAllowedError'?'Permiso de cámara denegado. Habilitalo en Safari.':err.name==='NotFoundError'?'No se encontró una cámara.':err.message;status('No se pudo activar la cámara: '+msg)}finally{starting=false}};
$('start').onclick=startCamera;window.addEventListener('load',()=>setTimeout(startCamera,750));
let prevTime=-1;function tick(){if(video.readyState>=2&&landmarker){try{if(video.currentTime!==prevTime){prevTime=video.currentTime;lastResult=landmarker.detectForVideo(video,performance.now())}overlay.width=video.videoWidth;overlay.height=video.videoHeight;ctx.clearRect(0,0,overlay.width,overlay.height);const face=lastResult?.faceLandmarks?.[0];if(face){ctx.fillStyle='#55cbff';for(const i of [1,4,33,133,263,362,61,291,152,10,234,454]){const p=face[i];ctx.beginPath();ctx.arc(p.x*overlay.width,p.y*overlay.height,2.5,0,Math.PI*2);ctx.fill()}}}catch(e){console.error(e)}}if(stream)requestAnimationFrame(tick)}
function vector(face){const ids=[33,133,263,362,1,4,61,291,13,14,152,10,234,454,70,300,105,334,168,6,197,195,5,98,327];const l=face[33],r=face[263];const scale=Math.hypot(r.x-l.x,r.y-l.y)||1;const cx=(l.x+r.x)/2,cy=(l.y+r.y)/2;return ids.flatMap(i=>[(face[i].x-cx)/scale,(face[i].y-cy)/scale])}function distance(a,b){return Math.sqrt(a.reduce((s,x,i)=>s+(x-b[i])**2,0)/a.length)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function sample(){const all=[];for(let i=0;i<15;i++){await wait(130);const f=lastResult?.faceLandmarks?.[0];if(f)all.push(vector(f))}if(all.length<10)throw Error('No se detectó un rostro estable.');return all[0].map((_,j)=>all.reduce((s,a)=>s+a[j],0)/all.length)}
function blend(name){return lastResult?.faceBlendshapes?.[0]?.categories?.find(x=>x.categoryName===name)?.score||0}function setStep(n,t,d){$('bar').style.width=(n*25)+'%';status(t,d);$('camera').classList.toggle('good',n>0)}
function facePose(f){const left=f[234],right=f[454],nose=f[1];const width=Math.abs(right.x-left.x)||1;return (nose.x-(left.x+right.x)/2)/width}
async function awaitFace(timeout=18000){let stable=0;const until=Date.now()+timeout;while(Date.now()<until){await wait(170);const f=lastResult?.faceLandmarks?.[0];if(f){const center=f[1];const size=Math.abs(f[454].x-f[234].x);if(center.x>.25&&center.x<.75&&center.y>.2&&center.y<.8&&size>.16){stable++;if(stable>=5)return true}else stable=0}else stable=0}return false}
async function awaitTurn(direction,timeout=20000){const until=Date.now()+timeout;let streak=0;let maximum=0;while(Date.now()<until){await wait(130);const f=lastResult?.faceLandmarks?.[0];if(!f){streak=0;continue}const yaw=facePose(f);const signed=yaw*direction;maximum=Math.max(maximum,signed);if(signed>.065){if(++streak>=3)return true}else streak=0}throw Error('No se detectó el giro. Mové la cabeza lentamente, sin mover el teléfono.')}
async function awaitBlink(timeout=16000){const until=Date.now()+timeout;let seenOpen=false;let closed=false;while(Date.now()<until){await wait(110);if(!lastResult?.faceLandmarks?.length)continue;const a=blend('eyeBlinkLeft'),b=blend('eyeBlinkRight');if(a<.27&&b<.27)seenOpen=true;if(seenOpen&&a>.42&&b>.42)closed=true;if(closed&&a<.32&&b<.32)return true}throw Error('No se detectó el parpadeo.')}
async function flow(mode){if(working||!landmarker)return;working=true;$('enroll').disabled=$('verify').disabled=true;try{setStep(0,'Centrando tu rostro…','Mirá de frente y mantené el teléfono quieto.');if(!await awaitFace())throw Error('No se encontró el rostro centrado.');setStep(1,'Girá la cabeza a tu derecha','Giralo lentamente, como si miraras hacia tu hombro derecho.');await awaitTurn(-1);setStep(2,'Ahora hacia tu izquierda','Girá la cabeza hacia el otro lado.');await awaitTurn(1);setStep(3,'Parpadeá una vez','Volvé a mirar de frente y cerrá ambos ojos un instante.');await awaitBlink();setStep(3,'Analizando tu rostro…','Mantené la mirada al frente.');await wait(800);const v=await sample();if(mode==='enroll'){pendingTemplate=v;$('nameForm').hidden=false;setStep(4,'Registro completado','Escribí tu nombre para continuar.')}else{const saved=credential();if(!saved)throw Error('No hay un rostro registrado.');const d=distance(v,saved.template);if(d<.115){setStep(4,'Identidad verificada','');welcome(saved.name)}else throw Error('El rostro no coincide con el registro guardado.')} $('camera').classList.add('done')}catch(e){$('camera').classList.remove('good');status('No se completó la validación',e.message);$('bar').style.width='0';$('start').hidden=false;$('start').textContent='Reintentar';$('start').disabled=false;$('start').onclick=()=>{ $('start').hidden=true;flow(credential()?'verify':'enroll')}}finally{working=false;$('enroll').disabled=$('verify').disabled=false}}
$('enroll').onclick=()=>flow('enroll');$('verify').onclick=()=>flow('verify');window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
